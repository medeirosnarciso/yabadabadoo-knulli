name: Build Yabadabadoo aarch64 (Knulli / H700)

# Workflow autocontido: este único arquivo cria o instalador e os scripts de build.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag ou branch do Yabadabadoo a compilar"
        default: "v0.2"
      platform:
        description: "Plataforma do Makefile (vazio = tenta varias automaticamente)"
        default: ""
      extra_make_args:
        description: "Argumentos extras para o make (ex.: HAVE_SH2_DYNAREC=0)"
        default: ""

jobs:
  build:
    # Ubuntu 22.04 = glibc 2.35: o .so resultante roda em glibc mais nova (o Knulli).
    runs-on: ubuntu-22.04
    steps:
      - name: Gerar instalador e scripts do projeto
        run: |
          set -eu
          mkdir -p ci knulli package
          cat > ci/build-aarch64.sh <<'__YABA_EOF_0__'
          #!/usr/bin/env bash
          # Compila o core Yabadabadoo para aarch64 (Knulli no H700).
          # Tenta varias plataformas do Makefile ate gerar um .so ELF 64-bit aarch64.
          set -u
          ROOT="$(pwd)"
          SRC="$ROOT/src/yabause/src/libretro"
          LOGS="$ROOT/out/logs"
          SHIM="$ROOT/out/shim"
          mkdir -p "$LOGS" "$ROOT/out" "$SHIM"

          [ -d "$SRC" ] || { echo "ERRO: $SRC nao existe (estrutura do repositorio mudou?)"; exit 1; }

          # --- diagnostico: ajuda a ajustar flags se o build falhar ---
          {
            echo "== Makefile: linhas de plataforma =="
            grep -nE 'platform' "$SRC/Makefile" | head -80 || true
            echo; echo "== Makefile: bloco miyoomini =="
            grep -n -A30 'miyoomini' "$SRC/Makefile" | head -80 || true
            echo; echo "== Referencias a dynarec =="
            grep -rniE 'dynarec' "$SRC/Makefile" "$SRC"/*.mk 2>/dev/null | head -40 || true
          } > "$LOGS/diagnostico.txt" 2>&1

          # --- compiladores "filtro": removem flags de x86/ARM 32-bit que o gcc aarch64 rejeita ---
          for t in gcc g++; do
            cat > "$SHIM/aarch64-$t" <<SHIMEOF
          #!/usr/bin/env bash
          args=()
          for a in "\$@"; do
            case "\$a" in
              -marm|-mthumb|-mfpmath=*|-msse*|-mssse3|-mavx*|-mfloat-abi=*|-mfpu=*|-m32|-DARM|-march=armv7*|-mtune=cortex-a7|-mtune=cortex-a9) ;;
              *) args+=("\$a") ;;
            esac
          done
          exec aarch64-linux-gnu-$t "\${args[@]}"
          SHIMEOF
            chmod +x "$SHIM/aarch64-$t"
          done

          CANDIDATES="${PLATFORM:-unix classic_armv8_a35}"
          OK=""

          for p in $CANDIDATES; do
            echo "=== Tentando platform=$p ==="
            make -C "$SRC" clean >/dev/null 2>&1 || true
            rm -f "$SRC"/*.so
            if make -C "$SRC" -j"$(nproc)" platform="$p" \
                  CC="$SHIM/aarch64-gcc" CXX="$SHIM/aarch64-g++" AR=aarch64-linux-gnu-ar STRIP=aarch64-linux-gnu-strip \
                  ARCH=aarch64 HAVE_SH2_DYNAREC=0 SH2_DYNAREC=0 NO_DYNAREC=1 \
                  ${EXTRA_MAKE_ARGS:-} > "$LOGS/make-$p.log" 2>&1; then
              SO="$(ls "$SRC"/*libretro*.so 2>/dev/null | head -1)"
              if [ -n "$SO" ] && file "$SO" | grep -q 'ARM aarch64'; then
                cp "$SO" "$ROOT/out/yabadabadoo_libretro.so"
                OK="$p"; echo "OK com platform=$p"; break
              fi
              echo "make terminou, mas o .so nao e aarch64: $(file "$SO" 2>/dev/null)"
            else
              echo "Falhou com platform=$p. Erros:"
              grep -nE 'error|Error|undefined reference|No such file|cannot find' "$LOGS/make-$p.log" | cut -c1-220 | head -25
            fi
          done

          if [ -z "$OK" ]; then
            echo "ERRO: nenhuma plataforma gerou um .so aarch64. Veja os artefatos 'build-logs'."
            exit 1
          fi

          # --- relatorio de compatibilidade ---
          {
            file "$ROOT/out/yabadabadoo_libretro.so"
            echo "glibc mais nova exigida: $(aarch64-linux-gnu-objdump -T "$ROOT/out/yabadabadoo_libretro.so" | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1)"
            aarch64-linux-gnu-readelf -d "$ROOT/out/yabadabadoo_libretro.so" | grep NEEDED
            echo "dynarec ARM presente?: $(strings "$ROOT/out/yabadabadoo_libretro.so" | grep -c 'SH2DynarecExec')"
          } | tee "$LOGS/relatorio.txt"
          __YABA_EOF_0__
          cat > ci/make-package.sh <<'__YABA_EOF_1__'
          #!/usr/bin/env bash
          # Monta o zip que deve ser extraido na raiz da particao SHARE (/userdata) do Knulli.
          set -eu
          ROOT="$(pwd)"
          P="$ROOT/out/pkg"
          rm -rf "$P"; mkdir -p "$P/yabadabadoo-knulli" "$P/roms/ports"

          cp "$ROOT/out/yabadabadoo_libretro.so"        "$P/yabadabadoo-knulli/"
          cp "$ROOT"/knulli/yabadabadoo_libretro.info   "$P/yabadabadoo-knulli/"
          cp "$ROOT"/knulli/install.sh "$ROOT"/knulli/uninstall.sh "$ROOT"/knulli/saturn_overlay.py "$P/yabadabadoo-knulli/"
          cp "$ROOT"/package/*.sh "$P/roms/ports/"
          chmod +x "$P"/yabadabadoo-knulli/*.sh "$P"/roms/ports/*.sh

          ( cd "$P" && zip -qr "$ROOT/out/yabadabadoo-knulli.zip" . )
          unzip -l "$ROOT/out/yabadabadoo-knulli.zip"
          __YABA_EOF_1__
          cat > knulli/install.sh <<'__YABA_EOF_2__'
          #!/bin/sh
          # Instalador do Yabadabadoo (core Sega Saturn) para Knulli no H700 (aarch64).
          # Uso:  sh install.sh [--set-default] [--no-restart]
          #   --set-default  deixa o Yabadabadoo como core padrão do Saturn
          #   --no-restart   não reinicia o EmulationStation no final
          # Variável ROOT (opcional) só existe para testes em outro diretório.

          ROOT="${ROOT:-}"
          DIR="$(cd "$(dirname "$0")" && pwd)"
          LOG="$ROOT/userdata/yabadabadoo-install.log"
          CORE="yabadabadoo_libretro.so"
          INFO="yabadabadoo_libretro.info"
          SET_DEFAULT=0; RESTART=1
          for a in "$@"; do
            case "$a" in --set-default) SET_DEFAULT=1;; --no-restart) RESTART=0;; esac
          done

          mkdir -p "$(dirname "$LOG")" 2>/dev/null
          : > "$LOG"
          say() { echo "$*"; echo "$*" >> "$LOG"; }
          die() { say "ERRO: $*"; exit 1; }

          say "== Yabadabadoo para Knulli =="

          # 1) Arquivos do pacote
          [ -f "$DIR/$CORE" ] || die "$CORE não está ao lado do install.sh"
          [ -f "$DIR/$INFO" ] || die "$INFO não está ao lado do install.sh"

          # 2) Recusa o core errado: precisa ser ELF 64-bit (classe 2) aarch64 (machine 0xb7)
          elf_class=$(dd if="$DIR/$CORE" bs=1 skip=4  count=1 2>/dev/null | od -An -tx1 | tr -d ' \n')
          elf_mach=$( dd if="$DIR/$CORE" bs=1 skip=18 count=1 2>/dev/null | od -An -tx1 | tr -d ' \n')
          if [ "$elf_class" != "02" ] || [ "$elf_mach" != "b7" ]; then
            die "este $CORE não é aarch64 (classe=$elf_class, machine=$elf_mach). O core ARM 32-bit do Miyoo/stock NÃO carrega no RetroArch 64-bit do Knulli."
          fi
          if [ -z "$ROOT" ] && [ "$(uname -m)" != "aarch64" ]; then
            die "este aparelho não é aarch64 ($(uname -m))."
          fi

          # 3) Pastas de destino (o Knulli guarda cores e info na imagem do sistema)
          CORE_DIR="$ROOT/usr/lib/libretro"
          INFO_DIR="$ROOT/usr/share/libretro/info"
          other=$(find "$ROOT/usr/share" -maxdepth 4 -name 'snes9x_libretro.info' 2>/dev/null | head -1)
          [ -n "$other" ] && INFO_DIR="$(dirname "$other")"
          [ -d "$CORE_DIR" ] || die "pasta de cores não encontrada: $CORE_DIR"
          mkdir -p "$INFO_DIR"

          cp -f "$DIR/$CORE" "$CORE_DIR/$CORE" || die "falha ao copiar o core (sistema somente leitura?)"
          cp -f "$DIR/$INFO" "$INFO_DIR/$INFO" || die "falha ao copiar o .info"
          chmod 755 "$CORE_DIR/$CORE"; chmod 644 "$INFO_DIR/$INFO"
          say "core  -> $CORE_DIR/$CORE"
          say "info  -> $INFO_DIR/$INFO"

          # 4) Faz o Saturn listar o Yabadabadoo no menu de cores
          ES_DIR="$ROOT/userdata/system/configs/emulationstation"
          ES_SRC="$ROOT/usr/share/emulationstation/es_systems.cfg"
          mkdir -p "$ES_DIR"
          if command -v python3 >/dev/null 2>&1 && [ -f "$ES_SRC" ]; then
            python3 "$DIR/saturn_overlay.py" "$ES_SRC" "$ES_DIR/es_systems_yabadabadoo.cfg" >> "$LOG" 2>&1 \
              && say "menu  -> $ES_DIR/es_systems_yabadabadoo.cfg" \
              || say "AVISO: não consegui gerar o overlay do menu (veja $LOG). Use: saturn.emulator=libretro / saturn.core=yabadabadoo no batocera.conf."
          else
            say "AVISO: python3 ou $ES_SRC ausente; overlay do menu não criado."
          fi

          # 5) Core padrão (opcional)
          if [ "$SET_DEFAULT" = 1 ]; then
            if command -v batocera-settings-set >/dev/null 2>&1; then
              batocera-settings-set saturn.emulator libretro
              batocera-settings-set saturn.core yabadabadoo
              say "padrão -> Saturn usa yabadabadoo"
            else
              say "AVISO: batocera-settings-set indisponível; defina saturn.core=yabadabadoo em /userdata/system/batocera.conf"
            fi
          fi

          # 6) BIOS
          BIOS="$ROOT/userdata/bios"
          if [ -f "$BIOS/saturn_bios.bin" ] || [ -f "$BIOS/sega_101.bin" ] || [ -f "$BIOS/mpr-17933.bin" ]; then
            say "BIOS  -> encontrada em $BIOS"
          else
            say "AVISO: nenhuma BIOS do Saturn em $BIOS (sega_101.bin, mpr-17933.bin ou saturn_bios.bin). O core exige uma."
          fi

          # 7) Persiste as mudanças feitas na imagem do sistema (sobrevivem ao reboot)
          if command -v batocera-save-overlay >/dev/null 2>&1; then
            batocera-save-overlay >> "$LOG" 2>&1 && say "overlay do sistema salvo (persistente)"
          else
            say "AVISO: batocera-save-overlay não encontrado; a instalação pode sumir ao reiniciar."
          fi

          say "Instalação concluída. Log: $LOG"

          # 8) Recarrega o EmulationStation (por último, em segundo plano)
          if [ "$RESTART" = 1 ] && [ -z "$ROOT" ]; then
            if command -v batocera-es-swissknife >/dev/null 2>&1; then
              ( sleep 2; batocera-es-swissknife --restart ) >/dev/null 2>&1 &
            else
              say "Reinicie o aparelho para o menu ler o novo core."
            fi
          fi
          exit 0
          __YABA_EOF_2__
          cat > knulli/uninstall.sh <<'__YABA_EOF_3__'
          #!/bin/sh
          # Remove o Yabadabadoo do Knulli.
          ROOT="${ROOT:-}"
          LOG="$ROOT/userdata/yabadabadoo-install.log"
          mkdir -p "$(dirname "$LOG")" 2>/dev/null; : > "$LOG"
          say() { echo "$*"; echo "$*" >> "$LOG"; }

          rm -f "$ROOT/usr/lib/libretro/yabadabadoo_libretro.so"
          find "$ROOT/usr/share" -maxdepth 5 -name 'yabadabadoo_libretro.info' -exec rm -f {} \; 2>/dev/null
          rm -f "$ROOT/userdata/system/configs/emulationstation/es_systems_yabadabadoo.cfg"

          CONF="$ROOT/userdata/system/batocera.conf"
          if [ -f "$CONF" ] && grep -q '^saturn.core=yabadabadoo' "$CONF"; then
            sed -i '/^saturn\.core=yabadabadoo/d' "$CONF"
            say "core padrão do Saturn restaurado (linha removida do batocera.conf)"
          fi

          command -v batocera-save-overlay >/dev/null 2>&1 && batocera-save-overlay >> "$LOG" 2>&1
          say "Yabadabadoo removido."
          [ -z "$ROOT" ] && command -v batocera-es-swissknife >/dev/null 2>&1 && ( sleep 2; batocera-es-swissknife --restart ) >/dev/null 2>&1 &
          exit 0
          __YABA_EOF_3__
          cat > knulli/saturn_overlay.py <<'__YABA_EOF_4__'
          #!/usr/bin/env python3
          """Gera um overlay do EmulationStation que acrescenta o core 'yabadabadoo'
          ao sistema Saturn, preservando os cores que o Knulli já oferece.
          Uso: saturn_overlay.py <es_systems.cfg original> <overlay de saída>"""
          import sys
          import xml.etree.ElementTree as ET

          CORE = "yabadabadoo"
          src, dst = sys.argv[1], sys.argv[2]

          root = ET.parse(src).getroot()
          system = next((s for s in root.iter("system") if (s.findtext("name") or "").strip() == "saturn"), None)
          if system is None:
              sys.exit("sistema 'saturn' não encontrado em " + src)

          emulators = system.find("emulators")
          if emulators is None:
              emulators = ET.SubElement(system, "emulators")
          libretro = next((e for e in emulators.findall("emulator") if e.get("name") == "libretro"), None)
          if libretro is None:
              libretro = ET.SubElement(emulators, "emulator", name="libretro")
          cores = libretro.find("cores")
          if cores is None:
              cores = ET.SubElement(libretro, "cores")

          if not any((c.text or "").strip() == CORE for c in cores.findall("core")):
              ET.SubElement(cores, "core").text = CORE

          out = ET.Element("systemList")
          out.append(system)
          tree = ET.ElementTree(out)
          ET.indent(tree, space="  ")
          tree.write(dst, encoding="utf-8", xml_declaration=True)
          print("overlay gerado:", dst)
          __YABA_EOF_4__
          cat > knulli/yabadabadoo_libretro.info <<'__YABA_EOF_5__'
          # Software Information
          display_name = "Sega - Saturn (Yabadabadoo)"
          authors = "Guillaume Duhammel|Theo Berkau|Anders Montonen|Yabadabadoo contributors"
          supported_extensions = "cue|iso|mds|ccd|zip|chd|m3u"
          corename = "Yabadabadoo"
          categories = "Emulator"
          license = "GPLv2"
          permissions = ""
          display_version = "0.2-aarch64"

          # Hardware Information
          manufacturer = "Sega"
          systemname = "Saturn"
          systemid = "sega_saturn"

          # Libretro Features
          database = "Sega - Saturn"
          supports_no_game = "false"
          savestate = "true"
          savestate_features = "basic"

          # BIOS / Firmware
          firmware_count = 3
          firmware0_desc = "saturn_bios.bin (Saturn BIOS, any region)"
          firmware0_path = "saturn_bios.bin"
          firmware0_opt = "true"
          firmware1_desc = "sega_101.bin (Saturn BIOS v1.01, Japan)"
          firmware1_path = "sega_101.bin"
          firmware1_opt = "true"
          firmware2_desc = "mpr-17933.bin (Saturn BIOS v1.00, USA/Europe)"
          firmware2_path = "mpr-17933.bin"
          firmware2_opt = "true"
          notes = "(!) One of these BIOS files is required; without one the core shows a screen saying where to put it.|(!) sega_101.bin (md5): 85ec9ca47d8f6807718151cbcca8b964|(!) mpr-17933.bin (md5): 3240872c70984b6cbfda1586cab68dbe|Port aarch64 para Knulli (H700). Sem dynarec: usa o interpretador SH2. Baseado no core Yabause libretro."

          description = "Fork do Yabause (Saturn) ajustado para handhelds fracos; build aarch64 para Knulli/H700 (renderizacao por software)."
          __YABA_EOF_5__
          cat > package/Instalar_Yabadabadoo.sh <<'__YABA_EOF_6__'
          #!/bin/sh
          # Atalho do menu Ports: instala o Yabadabadoo. Log em /userdata/yabadabadoo-install.log
          sh /userdata/yabadabadoo-knulli/install.sh "$@"
          __YABA_EOF_6__
          cat > package/Desinstalar_Yabadabadoo.sh <<'__YABA_EOF_7__'
          #!/bin/sh
          # Atalho do menu Ports: remove o Yabadabadoo.
          sh /userdata/yabadabadoo-knulli/uninstall.sh
          __YABA_EOF_7__
          chmod +x ci/*.sh knulli/*.sh package/*.sh

      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git file zip \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Baixar o código-fonte do Yabadabadoo
        run: |
          git clone --branch "${{ inputs.ref }}" \
            https://github.com/ProRapSuperstarOriginalMaster/Yabadabadoo.git src
          git -C src submodule update --init --recursive || true

      - name: Compilar (aarch64, sem dynarec ARM 32-bit)
        env:
          PLATFORM: ${{ inputs.platform }}
          EXTRA_MAKE_ARGS: ${{ inputs.extra_make_args }}
        run: bash ci/build-aarch64.sh

      - name: Montar o pacote do Knulli
        run: bash ci/make-package.sh

      - name: Publicar pacote
        uses: actions/upload-artifact@v4
        with:
          name: yabadabadoo-knulli
          path: out/yabadabadoo-knulli.zip
          if-no-files-found: error

      - name: Publicar logs (sempre)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: out/logs/
          if-no-files-found: ignore
